name: What's Up? Daily Post Automation

# ============================================================
# SCHEDULE: 4 posts/day (Mon-Sat), 1 post on Sunday
# ============================================================
# GitHub Actions uses UTC. IST = UTC + 5:30
# 
# DAILY (Mon-Sat): 2 runs × 2 posts = 4 posts/day
#   Run 1: 03:00 UTC → ~08:30 AM IST (Morning)
#   Run 2: 12:00 UTC → ~05:30 PM IST (Evening)
#
# SUNDAY: 1 post (Weekly Recap with Unsplash hero image)
#   03:00 UTC → ~08:30 AM IST - Generate weekly recap
#
# Weekly output: 24 posts (Mon-Sat) + 1 recap (Sunday) = 25 posts
# ============================================================

on:
  schedule:
    # Daily runs (including Sunday weekly recap)
    - cron: '0 3 * * *'     # ~08:30 AM IST - Daily (Sun: weekly recap)
    - cron: '0 12 * * 1-6'  # ~05:30 PM IST - Mon-Sat only (skips Sunday)
  
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      skip_delay:
        description: 'Skip random delay (for testing)'
        required: false
        default: 'false'
        type: boolean

# Prevent concurrent runs
concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    
    # Set timeout to prevent hanging jobs
    timeout-minutes: 60
    
    steps:
      # ============================================================
      # STEP 1: Checkout Repository
      # ============================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      
      # ============================================================
      # STEP 2: Set up Python Environment
      # ============================================================
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      
      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      # ============================================================
      # STEP 3: Add Random Delay (Natural Timing)
      # ============================================================
      # This makes posts appear at different times each day,
      # avoiding the "robotic" pattern of exact scheduling
      - name: ⏳ Add random delay for natural timing
        if: ${{ github.event.inputs.skip_delay != 'true' }}
        run: |
          # Random delay between 0 and 20 minutes (1200 seconds)
          DELAY=$((RANDOM % 1200))
          echo "⏳ Sleeping for $((DELAY / 60)) minutes and $((DELAY % 60)) seconds..."
          sleep $DELAY
          echo "✅ Delay complete, starting automation"
      
      # ============================================================
      # STEP 4: Create Required Directories
      # ============================================================
      - name: 📁 Ensure directories exist
        run: |
          mkdir -p data
          mkdir -p _posts
          mkdir -p assets/img/posts
          
          # Create history file if it doesn't exist
          if [ ! -f data/history.log ]; then
            echo "# What's Up? Processing History" > data/history.log
            echo "# Format: IMDB_ID  # Title - Date" >> data/history.log
          fi
          
          # Create metadata file if it doesn't exist
          if [ ! -f data/metadata_db.json ]; then
            echo '{"posts": []}' > data/metadata_db.json
          fi
      
      # ============================================================
      # STEP 5: Copy CSV Files (if in different location)
      # ============================================================
      - name: 📋 Verify CSV files
        run: |
          if [ ! -f data/movies.csv ]; then
            echo "❌ movies.csv not found in data/ directory!"
            echo "Please ensure your IMDb export files are in the data/ folder."
            exit 1
          fi
          
          if [ ! -f data/series.csv ]; then
            echo "❌ series.csv not found in data/ directory!"
            echo "Please ensure your IMDb export files are in the data/ folder."
            exit 1
          fi
          
          echo "✅ CSV files verified"
          echo "   Movies: $(wc -l < data/movies.csv) lines"
          echo "   Series: $(wc -l < data/series.csv) lines"
      
      # ============================================================
      # STEP 6: Run Main Automation Script
      # ============================================================
      - name: 🤖 Run blog automation
        env:
          # Required API Keys
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          
          # Unsplash API (for Sunday weekly recap images)
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          
          # Telegram Configuration (for manual fallback)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          # Email Configuration (for alerts)
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          
          # Pass the cron expression that triggered this run (empty for workflow_dispatch)
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          cd scripts
          python main.py
      
      # ============================================================
      # STEP 7: Commit and Push Changes
      # ============================================================
      - name: 📝 Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "What's Up Bot"
      
      - name: 📤 Commit changes
        run: |
          # Add all changes
          git add -A
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            # Get count of new posts
            NEW_POSTS=$(git diff --staged --name-only | grep "^_posts/" | wc -l)
            NEW_IMAGES=$(git diff --staged --name-only | grep "^assets/img/" | wc -l)
            
            # Create commit message
            COMMIT_MSG="🎬 Auto-publish: ${NEW_POSTS} post(s), ${NEW_IMAGES} image(s) - $(date +'%Y-%m-%d %H:%M')"
            
            git commit -m "$COMMIT_MSG"
            echo "✅ Changes committed: $COMMIT_MSG"
          fi
      
      - name: 🚀 Push to repository
        run: |
          if git log origin/main..HEAD --oneline | grep -q .; then
            # Pull any remote changes and rebase our commits on top
            git pull --rebase origin main
            git push
            echo "✅ Changes pushed to repository"
          else
            echo "ℹ️ Nothing to push"
          fi
      
      # ============================================================
      # STEP 8: Summary
      # ============================================================
      - name: 📊 Generate summary
        run: |
          echo "## 🎬 What's Up? Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run Time | $(date +'%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Posts | $(ls -1 _posts/*.md 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Images | $(ls -1 assets/img/posts/*.webp 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| History Entries | $(grep -c '^tt' data/history.log 2>/dev/null || echo 0) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Latest Posts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -1t _posts/*.md 2>/dev/null | head -5 | while read f; do
            echo "- \`$(basename $f)\`" >> $GITHUB_STEP_SUMMARY
          done
